<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>この道、60キロ→30キロ？</title>
  <meta name="description" content="2026-09-01 施行の生活道路 30 km/h で法定速度が 60→30 に変わった道路(推定)を表示する地図" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1b1e24" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="この道、60キロ→30キロ？" />
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🚗</span>
        <h1>この道、60キロ→30キロ？</h1>
      </div>
      <div class="head-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <p class="lead">
        中央線・車両通行帯・中央分離帯のない道路の法定速度が 60→30 km/h に（2026-09-01 施行）。
        どの道が変わったかを公開データから<b>推定</b>した地図です。
      </p>

      <div class="field">
        <div class="field-head"><span class="field-label">エリア</span></div>
        <select id="area" class="select" aria-label="エリア"></select>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">市区町村</span>
          <div class="field-actions"><button id="muni-clear" class="mini-btn" type="button">解除</button></div>
        </div>
        <input id="muni-input" class="select" list="muni-list" type="search" placeholder="全国から検索（例: 川越市）"
               autocomplete="off" enterkeyhint="search" aria-label="市区町村を検索" />
        <datalist id="muni-list"></datalist>
      </div>

      <div class="field">
        <div class="field-head"><span class="field-label">表示</span></div>
        <div id="mode" class="segmented" role="tablist" aria-label="表示の切替"></div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">凡例</span>
          <div class="field-actions">
            <button id="all-on" class="mini-btn" type="button">全ON</button>
            <button id="all-off" class="mini-btn" type="button">全OFF</button>
          </div>
        </div>
        <div id="legend" class="toggles"></div>
      </div>

      <p id="stat" class="stat"></p>

      <label class="toggle option">
        <input id="choropleth" type="checkbox" />
        <span class="t-label">市区町村を変更率で色分け（ズーム 12 未満）</span>
      </label>
      <div id="muni-scale" class="scale" hidden></div>
      <label class="toggle option">
        <input id="borders" type="checkbox" />
        <span class="t-label">行政区域の境界（国土数値情報 N03）</span>
      </label>
    </div>

    <footer class="panel-foot">
      <p class="disclaimer">推定です。標識の現地確認に代わるものではありません。</p>
      <a href="https://github.com/shiwaku/japan-legal-speed-30kmh-map/blob/main/docs/premise.md" target="_blank" rel="noopener">前提と限界</a> ・
      <a href="https://github.com/shiwaku/japan-legal-speed-30kmh-map/blob/main/docs/glossary.md" target="_blank" rel="noopener">用語集</a> ・
      <a href="https://github.com/shiwaku/japan-legal-speed-30kmh-map" target="_blank" rel="noopener">判定方法・コード</a><br />
      データ: <a href="https://github.com/gsi-cyberjapan/gsimaps-vector-experiment" target="_blank" rel="noopener">国土地理院 ベクトルタイル提供実験</a> /
      <a href="https://www.jartic.or.jp/service/opendata/" target="_blank" rel="noopener">JARTIC 交通規制情報</a> /
      背景: <a href="https://github.com/gsi-cyberjapan/optimal_bvmap" target="_blank" rel="noopener">最適化ベクトルタイル</a>
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
